  source: SELECT * FROM orders ORDER BY amount DESC FETCH FIRST 5 ROWS ONLY
  expected: SELECT * FROM orders ORDER BY amount DESC FETCH FIRST 5 ROWS ONLY
  status: auto
  rules: []
- id: ora-merge
  dialect: oracle
  source: >-
    MERGE INTO customers t USING staging_customers s ON (t.customer_id = s.customer_id) WHEN MATCHED THEN UPDATE
    SET t.name = s.name WHEN NOT MATCHED THEN INSERT (customer_id, name) VALUES (s.customer_id, s.name)
