name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, types, tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: sfm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d sfm_test"
          --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      SFM_TEST_DSN: postgresql://postgres:ci-only@localhost:5432/sfm_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Tests with coverage (validation on PostgreSQL and DuckDB)
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90

  evaluation:
    name: Corpus and injected-defect validation
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: sfm_source
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d sfm_source"
          --health-interval 2s --health-timeout 2s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Every corpus case exact, every defect caught, no false alarms
        run: >-
          sfmigrate eval --source-dsn postgresql://postgres:ci-only@localhost:5432/sfm_source
          --check --require-validation --report eval-report.md
      - name: The committed example translations are what the code produces
        run: |
          sfmigrate translate examples/legacy --out /tmp/examples
          diff -r docs/examples /tmp/examples
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval-report.md

  package:
    name: Wheel builds and works outside the repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - name: Install the wheel in a clean environment and run the corpus from it
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp && /tmp/venv/bin/sfmigrate eval --check
          /tmp/venv/bin/sfmigrate sql --dialect oracle "SELECT * FROM t WHERE ROWNUM <= 5"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[postgres,duckdb]" pip-audit
      - run: pip-audit --skip-editable
