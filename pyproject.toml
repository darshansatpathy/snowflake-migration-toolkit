[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "snowflake-migration-toolkit"
version = "0.1.0"
description = "Teradata and Oracle to Snowflake: assessment, rule-checked SQL translation and row-level validation across engines."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Darshan Kumar Satpathy" }]
keywords = ["snowflake", "teradata", "oracle", "migration", "sql-translation", "data-validation", "sqlglot"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Topic :: Database",
]
dependencies = [
  "sqlglot>=26.0",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
duckdb = ["duckdb>=1.0"]
snowflake = ["snowflake-connector-python>=3.0"]
oracle = ["oracledb>=2.0"]
teradata = ["teradatasql>=20.0"]
dev = [
  "psycopg[binary]>=3.1",
  "duckdb>=1.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "pip-audit>=2.7",
]

[project.scripts]
sfmigrate = "sfmigrate.cli:main"

[project.urls]
Repository = "https://github.com/darshansatpathy/snowflake-migration-toolkit"

[tool.hatch.build.targets.wheel]
packages = ["src/sfmigrate"]

[tool.hatch.build.targets.wheel.force-include]
"corpus" = "sfmigrate/corpus"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["sfmigrate"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108", "S608"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["sfmigrate"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["duckdb", "duckdb.*", "snowflake.*", "oracledb", "teradatasql"]
ignore_missing_imports = true
